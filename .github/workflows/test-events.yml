name: Test events updater

on:
  pull_request:
    paths:
      - 'scripts/update-events*'
      - 'package.json'
      - '.github/workflows/*events.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'scripts/update-events*'
      - 'package.json'
      - '.github/workflows/*events.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
